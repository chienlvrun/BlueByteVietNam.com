server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Trả Location tương đối để giữ nguyên https khi đứng sau reverse proxy
    absolute_redirect off;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Asset Astro có hash trong tên file → cache lâu dài
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
